name: Github Actions build with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      - name: Install Xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build and verify
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run --auto-servernum mvn install
          else
            mvn install
          fi

      - name: Upload native application (jlink runtime image)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hellofx-${{ runner.os }}
          path: target/image/
          if-no-files-found: warn

      - name: Add coverage summary to Allure environment
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          JACOCO_XML=target/site/jacoco/jacoco.xml
          if [ ! -f "$JACOCO_XML" ]; then
            echo "No JaCoCo report found at $JACOCO_XML, skipping"
            exit 0
          fi
          mkdir -p target/allure-results

          pct() {
            local missed=$1 covered=$2
            local total=$((missed + covered))
            if [ "$total" -eq 0 ]; then echo "n/a"; else awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f%%", (c/t)*100 }'; fi
          }

          read -r INSTR_MISSED INSTR_COVERED <<< "$(grep -oE '<counter type="INSTRUCTION" missed="[0-9]+" covered="[0-9]+"/>' "$JACOCO_XML" | tail -1 | grep -oE '[0-9]+' | tr '\n' ' ')"
          read -r LINE_MISSED LINE_COVERED <<< "$(grep -oE '<counter type="LINE" missed="[0-9]+" covered="[0-9]+"/>' "$JACOCO_XML" | tail -1 | grep -oE '[0-9]+' | tr '\n' ' ')"
          read -r METHOD_MISSED METHOD_COVERED <<< "$(grep -oE '<counter type="METHOD" missed="[0-9]+" covered="[0-9]+"/>' "$JACOCO_XML" | tail -1 | grep -oE '[0-9]+' | tr '\n' ' ')"

          {
            echo "LineCoverage=$(pct "$LINE_MISSED" "$LINE_COVERED") ($LINE_COVERED/$((LINE_MISSED + LINE_COVERED)) lines)"
            echo "InstructionCoverage=$(pct "$INSTR_MISSED" "$INSTR_COVERED")"
            echo "MethodCoverage=$(pct "$METHOD_MISSED" "$METHOD_COVERED") ($METHOD_COVERED/$((METHOD_MISSED + METHOD_COVERED)) methods)"
          } >> target/allure-results/environment.properties

      - name: Generate Allure report
        if: always() && matrix.os == 'ubuntu-latest'
        run: mvn --batch-mode --no-transfer-progress io.qameta.allure:allure-maven:2.15.0:report

      - name: Add JaCoCo HTML report to the published site
        if: always() && matrix.os == 'ubuntu-latest'
        run: |
          if [ -d target/site/jacoco ]; then
            cp -r target/site/jacoco target/site/allure-maven-plugin/jacoco
          fi

      - name: Upload Allure report (zip artifact)
        id: upload-allure-report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn

      - name: Upload Pages artifact
        if: always() && matrix.os == 'ubuntu-latest' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin/

  deploy-report:
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add report link to job summary
        run: |
          echo "[View the Allure report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "[View the full JaCoCo coverage report](${{ steps.deployment.outputs.page_url }}jacoco/index.html)" >> "$GITHUB_STEP_SUMMARY"
